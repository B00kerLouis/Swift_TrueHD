name: Native encoder and decoder builds
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS Xcode encoder and decoder
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select tested Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Build encoder and independent decoder targets
        run: |
          xcodebuild -version
          xcodebuild -project Swift_TrueHD.xcodeproj -scheme all -configuration Release -destination 'generic/platform=macOS' -derivedDataPath Build/EncoderDerived CONFIGURATION_BUILD_DIR="$PWD/Build/Products/Release" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project Swift_TrueHD.xcodeproj -scheme decoder_cli -configuration Release -destination 'generic/platform=macOS' -derivedDataPath Build/DecoderDerived CONFIGURATION_BUILD_DIR="$PWD/Build/Products/Release" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project Swift_TrueHD.xcodeproj -scheme decoder_framework -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath Build/DecoderDerived CONFIGURATION_BUILD_DIR="$PWD/Build/Products/Debug" CODE_SIGNING_ALLOWED=NO build
          lipo -info Build/Products/Release/turehda
          lipo -info Build/Products/Release/truehdd
          otool -L Build/Products/Release/truehdd
      - name: C and C++ policy and renderer tests
        run: |
          cmake -S . -B Build/Portable -DCMAKE_BUILD_TYPE=Release
          cmake --build Build/Portable --parallel 3
          ctest --test-dir Build/Portable --output-on-failure
      - name: Generate and validate an actual encoder fixture
        run: |
          mkdir -p Build/fixture
          Build/Portable/decoder_tests --generate Build/fixture/source.wav Build/fixture/source
          Build/Products/Release/turehda -i Build/fixture/source.wav -o Build/fixture/synthetic.mlp
          Build/Portable/decoder_tests --stream Build/fixture/synthetic.mlp Build/fixture/source
          Build/Products/Release/truehdd -i Build/fixture/synthetic.mlp -o Build/fixture/decoded.pcm --presentation 8 --format s24le
          cmp Build/fixture/decoded.pcm Build/fixture/source.8.pcm
          Build/Portable/truehdd play --help
      - name: Build independent FFmpeg adapter and run API and FATE tests
        shell: bash
        run: |
          cmake -S . -B Build/FFmpegLibrary -DCMAKE_BUILD_TYPE=Release -DSTHD_NATIVE_DEVICE=OFF -DCMAKE_INSTALL_PREFIX="$PWD/Build/FFmpegInstall"
          cmake --build Build/FFmpegLibrary --parallel 3
          cmake --install Build/FFmpegLibrary
          git init Build/FFmpegSource
          git -C Build/FFmpegSource remote add origin https://github.com/FFmpeg/FFmpeg.git
          git -C Build/FFmpegSource fetch --depth 1 origin "$(cat Integrations/FFmpeg/UPSTREAM_REVISION)"
          git -C Build/FFmpegSource checkout --detach FETCH_HEAD
          cmake -DFFMPEG_SOURCE="$PWD/Build/FFmpegSource" -P Integrations/FFmpeg/install.cmake
          export PKG_CONFIG_PATH="$PWD/Build/FFmpegInstall/lib/pkgconfig"
          (cd Build/FFmpegSource && ./configure --disable-everything --disable-autodetect --disable-doc --enable-ffmpeg --enable-ffprobe --enable-libtruehdd --pkg-config-flags=--static --enable-decoder=libtruehdd --enable-parser=mlp --enable-demuxer=truehd --enable-muxer=pcm_s24le,pcm_s32le,md5,framecrc --enable-encoder=pcm_s24le,pcm_s32le --enable-protocol=file,pipe,md5 --enable-filter=aresample,aformat,anull --enable-swresample && make -j3)
          sh Integrations/FFmpeg/check.sh "$PWD/Build/FFmpegSource" "$PWD/Build/FFmpegChecks"
      - uses: actions/upload-artifact@v4
        with:
          name: decoder-test-fixture
          path: |
            Build/fixture/synthetic.mlp
            Build/fixture/source.8.pcm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-native-products
          path: |
            Build/Products/Release/turehda
            Build/Products/Release/truehdd
            Build/Products/Release/libtruehda.framework
            Build/Products/Release/libtruehdd.framework
            LICENSE
            LICENSES/
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
  windows:
    name: Windows MSVC decoder
    runs-on: windows-2022
    needs: macos
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: decoder-test-fixture
          path: Build/fixture
      - name: Build native WASAPI and Spatial Audio decoder
        run: |
          cmake -S . -B Build/Portable -A x64
          cmake --build Build/Portable --config Release --parallel 3
          ctest --test-dir Build/Portable -C Release --output-on-failure
          & Build/Portable/Release/decoder_tests.exe --stream Build/fixture/synthetic.mlp Build/fixture/source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & Build/Portable/Release/truehdd.exe -i Build/fixture/synthetic.mlp -o Build/fixture/decoded.pcm --presentation 8 --format s24le
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash Build/fixture/decoded.pcm).Hash -ne (Get-FileHash Build/fixture/source.8.pcm).Hash) { throw 'PCM mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-decoder-products
          path: |
            Build/Portable/Release/truehdd.exe
            Build/Portable/Release/truehdd.dll
            Build/Portable/Release/truehdd.lib
            Sources/DecoderFramework/include/TrueHDDecoder.h
            Decoder/LICENSE
            LICENSES/LGPL-2.1-or-later.txt
          if-no-files-found: error
  linux:
    name: Linux GCC and PipeWire decoder
    runs-on: ubuntu-24.04
    needs: macos
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: decoder-test-fixture
          path: Build/fixture
      - name: Install native audio build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libasound2-dev pipewire pipewire-bin wireplumber dbus
      - name: Build and validate decoder and native channel plans
        run: |
          cmake -S . -B Build/Portable -DCMAKE_BUILD_TYPE=Release
          cmake --build Build/Portable --parallel 3
          ctest --test-dir Build/Portable --output-on-failure
          Build/Portable/decoder_tests --stream Build/fixture/synthetic.mlp Build/fixture/source
          Build/Portable/truehdd -i Build/fixture/synthetic.mlp -o Build/fixture/decoded.pcm --presentation 8 --format s24le
          cmp Build/fixture/decoded.pcm Build/fixture/source.8.pcm
          test -f Build/Portable/libtruehdd.so
          nm -D --defined-only Build/Portable/libtruehdd.so | grep 'sthd_player_feed'
          readelf -d Build/Portable/truehdd | grep 'libtruehdd.so.1'
      - name: Exercise actual PipeWire playback for all layouts
        run: dbus-run-session -- bash .github/scripts/test-pipewire.sh "$PWD/Build/Portable/audio_smoke" "$PWD/Build/Portable/player_smoke" "$PWD/Build/fixture/synthetic.mlp"
      - name: Address and undefined behavior sanitizers
        run: |
          cmake -S . -B Build/Sanitized -DCMAKE_BUILD_TYPE=Debug -DSTHD_NATIVE_DEVICE=OFF -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build Build/Sanitized --parallel 3
          ctest --test-dir Build/Sanitized --output-on-failure
          Build/Sanitized/decoder_tests --stream Build/fixture/synthetic.mlp Build/fixture/source
      - name: Build independent FFmpeg adapter and run API and FATE tests
        run: |
          cmake -S . -B Build/FFmpegLibrary -DCMAKE_BUILD_TYPE=Release -DSTHD_NATIVE_DEVICE=OFF -DCMAKE_INSTALL_PREFIX="$PWD/Build/FFmpegInstall"
          cmake --build Build/FFmpegLibrary --parallel 3
          cmake --install Build/FFmpegLibrary
          git init Build/FFmpegSource
          git -C Build/FFmpegSource remote add origin https://github.com/FFmpeg/FFmpeg.git
          git -C Build/FFmpegSource fetch --depth 1 origin "$(cat Integrations/FFmpeg/UPSTREAM_REVISION)"
          git -C Build/FFmpegSource checkout --detach FETCH_HEAD
          cmake -DFFMPEG_SOURCE="$PWD/Build/FFmpegSource" -P Integrations/FFmpeg/install.cmake
          export PKG_CONFIG_PATH="$PWD/Build/FFmpegInstall/lib/pkgconfig"
          export LD_LIBRARY_PATH="$PWD/Build/FFmpegInstall/lib"
          (cd Build/FFmpegSource && ./configure --disable-everything --disable-autodetect --disable-doc --enable-ffmpeg --enable-ffprobe --enable-libtruehdd --pkg-config-flags=--static --enable-decoder=libtruehdd --enable-parser=mlp --enable-demuxer=truehd --enable-muxer=pcm_s24le,pcm_s32le,md5,framecrc --enable-encoder=pcm_s24le,pcm_s32le --enable-protocol=file,pipe,md5 --enable-filter=aresample,aformat,anull --enable-swresample && make -j3)
          sh Integrations/FFmpeg/check.sh "$PWD/Build/FFmpegSource" "$PWD/Build/FFmpegChecks"
      - name: Structured decoder fuzz smoke
        run: |
          sudo apt-get install -y clang libclang-rt-dev
          cmake -S . -B Build/Fuzz -DSTHD_NATIVE_DEVICE=OFF -DSTHD_BUILD_FUZZER=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build Build/Fuzz --target decoder_fuzz --parallel 3
          mkdir -p Build/FuzzCorpus
          for input in Integrations/FFmpeg/fixtures/*.mlp; do dd if="$input" of="Build/FuzzCorpus/$(basename "$input")" bs=8190 count=1 status=none; done
          Build/Fuzz/decoder_fuzz Build/FuzzCorpus -max_total_time=20 -max_len=8190 -timeout=5 -seed=20261006
      - uses: actions/upload-artifact@v4
        with:
          name: linux-decoder-products
          path: |
            Build/Portable/truehdd
            Build/Portable/libtruehdd.so*
            Sources/DecoderFramework/include/TrueHDDecoder.h
            Decoder/LICENSE
            LICENSES/LGPL-2.1-or-later.txt
          if-no-files-found: error
